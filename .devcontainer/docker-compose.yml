services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: postgres_dev
    networks:
      - devnet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - TZ=America/Belem
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    restart: on-failure

  workspace:
    tty: true
    container_name: workspaces_dev
    restart: on-failure
    working_dir: /workspaces
    build:
      context: .
      target: development
      args:
        GO_VERSION: "1.26"
        NODE_VERSION: "24"
        TZ: "America/Belem"
    networks:
      - devnet
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - ./../:/workspaces:rw
      # Go caches
      - go_bin:/go/bin:rw
      - go_pkg:/go/pkg:rw
      # Frontend caches
      - node_modules:/workspaces/frontend/node_modules:rw
      - pnpm_store:/home/vscode/.local/share/pnpm/store:rw
      # Claude Code state
      - claude_code:/home/vscode/.claude:rw

networks:
  devnet:
    name: devnet
    driver: bridge

volumes:
  go_pkg: null
  go_bin: null
  node_modules: null
  pnpm_store: null
  claude_code: null
  postgres_data: null
