application:
  name: "my-app"
  description: "My Application Template"
  version: "1.0.0"
  log_level: "info"
  health_server_listen_port: 8081

server:
  listen_port: 8080
  # tls:
  #   certificate: "/etc/myapp/tls.crt"
  #   key: "/etc/myapp/tls.key"
  no_route_redir: ""
  write_timeout: 15s
  read_timeout: 15s
  idle_timeout: 60s

oidc:
  issuer_url: "https://auth.example.com/realms/example"
  client_id: "changeme"
  client_secret: "changeme"
  disable_introspection: false
  redirect_uri: "https://api.example.com/api/v1/auth/callback"
  scopes: ["openid", "profile", "email"]
  post_login_redirect_uri: "https://app.example.com/"
  post_logout_redirect_uri: "https://app.example.com/"
  cookie_domain: "" # empty = host-only cookie
  cookie_secure: true # only false for plain-HTTP local development
  cookie_same_site: "lax" # lax | strict | none
  cookie_path: "/"

# Origins allowed to make credentialed (cookie-based) requests to this API.
# Access-Control-Allow-Origin: * is incompatible with credentials, so every
# origin that serves the frontend must be listed explicitly.
cors:
  allowed_origins:
    - "http://localhost:5173"

databases:
  local:
    dsn: "file:myapp.db?cache=shared&_fk=1"
    dialector: "sqlite"
    log_level: "warn"