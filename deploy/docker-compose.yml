# Production compose. Development uses .devcontainer/docker-compose.dev.yml.
# Build contexts are the service folders, so COPY paths inside the
# Dockerfiles stay relative to backend/ and frontend/.
#
# Usage (from the repository root):
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  api:
    container_name: ${PROJECT_NAME:-my-app}-api
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: ../deploy/docker/backend.Dockerfile
      args:
        APP_NAME: ${PROJECT_NAME:-my-app}
    ports:
      - "8080:8080"
    networks:
      - appnet

  web:
    container_name: ${PROJECT_NAME:-my-app}-web
    restart: unless-stopped
    build:
      context: ../frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME:-my-app}
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
